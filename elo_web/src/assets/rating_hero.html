<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Cards Hero</title>
<style>
  :root{
    --bg:#0b1219;
    --card:#0f1a23;
    --card-edge:rgba(255,255,255,.08);
    --text:#eef3f6;
    --muted:#8d9aa5;
    --accent:#b6f24a;          /* lime figures, as in the sample */
    --card-w:300px;            /* change to resize every card */
    --gap:22px;
    --speed:60s;               /* time for one full loop */
  }
  @media (max-width:640px){ :root{ --card-w:220px; --gap:14px; } }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---------- HERO SHOWCASE (drop this block into your landing page) ---------- */
  .showcase{
    position:relative; overflow:hidden; padding:48px 0;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(182,242,74,.08), transparent 70%),
      var(--bg);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  }
  .row{display:flex;width:max-content;gap:var(--gap);padding:calc(var(--gap)/2) 0;
       animation:scroll-left var(--speed) linear infinite; will-change:transform}
  .row.reverse{animation-name:scroll-right; animation-duration:calc(var(--speed)*1.15); margin-left:calc(var(--card-w)*-.5)}
  .showcase:hover .row{animation-play-state:paused}
  @keyframes scroll-left {from{transform:translateX(0)}to{transform:translateX(calc(-50% - var(--gap)/2))}}
  @keyframes scroll-right{from{transform:translateX(calc(-50% - var(--gap)/2))}to{transform:translateX(0)}}

  .pcard{
    position:relative; flex:none; width:var(--card-w); aspect-ratio:4/5; border-radius:22px; overflow:hidden;
    background:linear-gradient(160deg,#1d2c38 0%,#0f1a23 70%);
    border:1px solid var(--card-edge);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.7);
    transition:transform .45s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;
  }
  .pcard:hover{transform:translateY(-8px) scale(1.03);border-color:rgba(182,242,74,.45);
               box-shadow:0 28px 50px -18px rgba(0,0,0,.8),0 0 0 1px rgba(182,242,74,.15)}
  .pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;
             transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .pcard:hover img{transform:scale(1.06)}
  /* dark fade so the text stays readable, like the sample */
  .pcard::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(11,18,25,.97) 0%,rgba(11,18,25,.82) 32%,rgba(11,18,25,0) 62%)}
  .info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:calc(var(--card-w)*.07)}
  .name{font-size:calc(var(--card-w)*.092);font-weight:500;letter-spacing:-.01em;line-height:1.1}
  .meta{margin-top:4px;font-size:calc(var(--card-w)*.042);color:var(--muted)}
  .label{margin-top:calc(var(--card-w)*.05);font:500 calc(var(--card-w)*.032)/1 ui-monospace,SFMono-Regular,Menlo,monospace;
         letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .points{margin-top:6px;font:500 calc(var(--card-w)*.125)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);
          font-variant-numeric:tabular-nums}
  .line{display:flex;justify-content:space-between;align-items:baseline;margin-top:calc(var(--card-w)*.045);
        padding-top:calc(var(--card-w)*.045);border-top:1px solid var(--card-edge);font-size:calc(var(--card-w)*.046);color:var(--muted)}
  .line b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}

  /* entrance: cards rise in one after another on load */
  .pcard{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms)}
  @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .row{animation:none}.pcard{animation:none}
    .showcase{overflow-x:auto}
  }
</style>
</head>

  // Row 2 starts from a different player so the two rows never match up.
  const offset = Math.floor(PLAYERS.length / 2);
  const order2 = [...PLAYERS.slice(offset), ...PLAYERS.slice(0, offset)];

  // Each row contains the list twice: the keyframes slide exactly half the width, so the loop is seamless.
  const fill = (el, list) => { el.innerHTML = [...list, ...list].map(card).join(""); };
  fill(document.getElementById("row1"), PLAYERS);
  fill(document.getElementById("row2"), order2);
